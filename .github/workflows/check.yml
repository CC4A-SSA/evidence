name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: No full-text documents in the repository
        run: |
          found=$(git ls-files '*.pdf' '*.PDF' '*.docx' '*.xlsx')
          if [ -n "$found" ]; then echo "Remove these files: $found"; exit 1; fi
      - name: Tables are valid and built from data/
        run: python3 build.py --check
